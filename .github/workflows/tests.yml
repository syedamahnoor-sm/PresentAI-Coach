name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only the lightweight libraries the automated tests import.
      # (OpenCV, MediaPipe, Whisper and Streamlit are not needed: the tests
      # cover pure logic and stub hardware/model dependencies.)
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scipy scikit-learn joblib \
                      pydantic python-dotenv langgraph langchain langchain-google-genai

      - name: Run tests
        run: pytest -q
